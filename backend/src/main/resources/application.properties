server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
app.production=${RENDER:false}
app.seed.enabled=${SEED_ENABLED:false}
jwt.secret=${JWT_SECRET:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://quiz-app.quangmanh12082005.workers.dev,http://localhost:5173,http://localhost:4173}
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Provider SeekAI tương thích OpenAI; cấu hình key/model ở môi trường backend.
seekai.api.key=${SEEKAI_API_KEY:}
seekai.api.base-url=${SEEKAI_API_BASE_URL:}
seekai.api.model=${SEEKAI_MODEL:}

# Giữ cấu hình Gemini hiện có cho chức năng tạo câu hỏi quản trị.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
