server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Provider SeekAI tương thích OpenAI; cấu hình key/model ở môi trường backend.
seekai.api.key=${SEEKAI_API_KEY:}
seekai.api.base-url=${SEEKAI_API_BASE_URL:https://seekai.cc/v1}
seekai.api.model=${SEEKAI_MODEL:}

# Giữ cấu hình Gemini hiện có cho chức năng tạo câu hỏi quản trị.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
